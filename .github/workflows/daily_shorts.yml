name: Daily Shorts Pipeline

on:
  schedule:
    - cron: "0 */6 * * *"   # Every 6 hours
  workflow_dispatch:
    inputs:
      movie:
        description: "Specific movie name (leave blank for trending)"
        required: false
      count:
        description: "Number of trending movies to process"
        default: "3"

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create output directories
        run: mkdir -p output/clips output/shorts assets/ambient

      - name: Write YouTube OAuth token
        if: ${{ env.YOUTUBE_TOKEN_JSON != '' }}
        run: echo "$YOUTUBE_TOKEN_JSON" > config/youtube_token.json
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

      - name: Run shorts pipeline (specific movie)
        if: ${{ github.event.inputs.movie != '' }}
        run: |
          python modules/1_shorts_automation/run_shorts.py \
            --movie "${{ github.event.inputs.movie }}"
        env:
          TMDB_API_KEY:                ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_CLIENT_SECRET_PATH:  config/youtube_client_secret.json
          TIKTOK_ACCESS_TOKEN:         ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_SESSION_COOKIE:       ${{ secrets.TIKTOK_SESSION_COOKIE }}

      - name: Run shorts pipeline (trending)
        if: ${{ github.event.inputs.movie == '' }}
        run: |
          python modules/1_shorts_automation/run_shorts.py \
            --trending \
            --count ${{ github.event.inputs.count || '3' }}
        env:
          TMDB_API_KEY:                ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_CLIENT_SECRET_PATH:  config/youtube_client_secret.json
          TIKTOK_ACCESS_TOKEN:         ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_SESSION_COOKIE:       ${{ secrets.TIKTOK_SESSION_COOKIE }}

      - name: Upload short artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-${{ github.run_id }}
          path: output/shorts/
          retention-days: 3
