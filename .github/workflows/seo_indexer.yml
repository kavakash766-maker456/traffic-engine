name: SEO Sitemap Indexer

on:
  schedule:
    - cron: "0 4 * * 1"   # Every Monday at 4 AM UTC
  workflow_dispatch:

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create output directory
        run: mkdir -p output/sitemaps

      - name: Fetch TMDb data
        run: python modules/3_programmatic_seo/tmdb_fetcher.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Generate sitemaps and ping search engines
        run: python modules/3_programmatic_seo/generate_sitemap.py
        env:
          TMDB_API_KEY:             ${{ secrets.TMDB_API_KEY }}
          GOOGLE_INDEXING_API_KEY:  ${{ secrets.GOOGLE_INDEXING_API_KEY }}
          BING_INDEXING_API_KEY:    ${{ secrets.BING_INDEXING_API_KEY }}

      - name: Upload sitemap artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sitemaps-${{ github.run_id }}
          path: output/sitemaps/
          retention-days: 7

      - name: Ping Google Search Console
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://web-umber-six-e1un7z6257.vercel.app/sitemaps/sitemap_index.xml" || true

      - name: Ping Bing
        run: |
          curl -s "https://www.bing.com/ping?sitemap=https://web-umber-six-e1un7z6257.vercel.app/sitemaps/sitemap_index.xml" || true
